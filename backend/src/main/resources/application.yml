spring:
  application:
    name: academicore

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/academicore}
    username: ${DB_USER:academicore}
    password: ${DB_PASSWORD:academicore_dev}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

supabase:
  url: ${SUPABASE_URL:http://localhost:54321}
  service-key: ${SUPABASE_SERVICE_KEY:eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU}
  storage:
    bucket-campus: campus
    bucket-aspirantes: aspirantes
    signed-url-expiry: 300

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

sentimiento:
  service-url: ${SENTIMENT_SERVICE_URL:http://localhost:5000}
