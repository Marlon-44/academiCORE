# Blueprint de Render — https://render.com/docs/blueprint-spec
# Despliega: backend Spring Boot + microservicio de sentimiento (Flask).
# La base de datos vive en Supabase (pooler) → credenciales como env vars
# marcadas sync:false (se definen en el dashboard de Render, nunca en el repo).
#
# Frontend: se despliega aparte en Vercel con VITE_API_URL apuntando a
# https://academicore-api.onrender.com

services:
  - type: web
    name: academicore-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DB_URL
        sync: false          # jdbc:postgresql://<pooler>:5432/postgres?sslmode=require
      - key: DB_USER
        sync: false          # postgres.<project-ref>
      - key: DB_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false          # https://<app>.vercel.app
      - key: COOKIE_SAMESITE
        value: None          # cookie cross-site Vercel→Render
      - key: COOKIE_SECURE
        value: "true"
      - key: SENTIMENT_SERVICE_URL
        fromService:
          type: web
          name: academicore-sentiment
          property: hostport  # host:port interno entre servicios de Render

  - type: web
    name: academicore-sentiment
    runtime: docker
    dockerfilePath: ./sentiment-service/Dockerfile
    dockerContext: ./sentiment-service
    plan: free
    healthCheckPath: /salud
