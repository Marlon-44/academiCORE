services:
  postgres:
    image: postgres:16-alpine
    container_name: academicore-db
    environment:
      POSTGRES_DB: academicore
      POSTGRES_USER: academicore
      POSTGRES_PASSWORD: academicore_dev
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Base de datos demo versionada en git: al primer arranque (volumen
      # vacío) Postgres ejecuta db/init/*.sql y carga esquema + datos.
      # Para recargar tras un cambio: docker compose down -v && docker compose up -d
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academicore -d academicore"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - academicore-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: academicore-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/academicore
      SPRING_DATASOURCE_USERNAME: academicore
      SPRING_DATASOURCE_PASSWORD: academicore_dev
      SPRING_PROFILES_ACTIVE: docker
      SUPABASE_URL: https://pxfitbmwillrxxbjlhjv.supabase.co
      SUPABASE_SERVICE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB4Zml0Ym13aWxscnh4YmpsaGp2Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4ODgxNjA1MiwiZXhwIjoyMTA0MzkyMDUyfQ.PaY_Vdlnmw_RzYkFWu_PWzpSS7tNBzp2qb3lDyn8F3I
      SENTIMENT_SERVICE_URL: http://sentiment:5000
    ports:
      - "8080:8080"
    networks:
      - academicore-net

  sentiment:
    build:
      context: ./sentiment-service
      dockerfile: Dockerfile
    container_name: academicore-sentiment
    ports:
      - "5000:5000"
    networks:
      - academicore-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: academicore-frontend
    depends_on:
      - backend
    ports:
      - "3002:80"
    networks:
      - academicore-net

networks:
  academicore-net:
    driver: bridge

volumes:
  pgdata:
