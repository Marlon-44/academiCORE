services:
  # Postgres local OPCIONAL — solo arranca con el perfil "localdb":
  #   docker compose --profile localdb up -d
  # Con Supabase (DB_URL en .env) no hace falta: el backend se conecta
  # directo a la base de datos remota.
  postgres:
    image: postgres:16-alpine
    container_name: academicore-db
    profiles:
      - localdb
    environment:
      POSTGRES_DB: academicore
      POSTGRES_USER: academicore
      POSTGRES_PASSWORD: academicore_dev
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Base de datos demo versionada en git: al primer arranque (volumen
      # vacío) Postgres ejecuta db/init/*.sql y carga esquema + datos.
      # Para recargar tras un cambio: docker compose down -v && docker compose up -d
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academicore -d academicore"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - academicore-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: academicore-backend
    depends_on:
      postgres:
        condition: service_healthy
        required: false   # solo si el perfil localdb está activo
    environment:
      # Supabase: definir DB_URL/DB_USER/DB_PASSWORD en .env (ver .env.example)
      # Local (--profile localdb): los defaults apuntan al postgres del compose
      SPRING_DATASOURCE_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/academicore}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-academicore}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-academicore_dev}
      # Flyway por pooler de sesion (:5432); la app puede ir por :6543
      SPRING_FLYWAY_URL: ${FLYWAY_DB_URL:-${DB_URL:-jdbc:postgresql://postgres:5432/academicore}}
      SPRING_FLYWAY_USER: ${FLYWAY_DB_USER:-${DB_USER:-academicore}}
      SPRING_FLYWAY_PASSWORD: ${FLYWAY_DB_PASSWORD:-${DB_PASSWORD:-academicore_dev}}
      SPRING_PROFILES_ACTIVE: docker
      SUPABASE_URL: ${SUPABASE_URL:-https://zxgrpzbunghncopuhiea.supabase.co}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      SENTIMENT_SERVICE_URL: http://sentiment:5000
      # Pooler Supabase gratis = 15 conexiones totales (compartido con Render)
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 4
    ports:
      # 8081 en el host: el 8080 lo ocupa otro proyecto (vitalylook-wordpress)
      # y tiene restart policy. Dentro de la red sigue siendo backend:8080.
      - "8081:8080"
    networks:
      - academicore-net

  sentiment:
    build:
      context: ./sentiment-service
      dockerfile: Dockerfile
    container_name: academicore-sentiment
    ports:
      - "5000:5000"
    networks:
      - academicore-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Vacio -> usa el backend local via nginx (/api).
        # Con URL -> front apunta directo a Render (como en Vercel).
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: academicore-frontend
    depends_on:
      - backend
    ports:
      - "3002:80"
    networks:
      - academicore-net

networks:
  academicore-net:
    driver: bridge

volumes:
  pgdata:
